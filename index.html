<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="be94e33a9e0c24f368481f7f2491f9fa">
    
    <title>X-WORLD Live</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        #main-content { display: flex; flex-direction: column; align-items: center; padding: 10px; }
        header { text-align: center; padding: 20px; width: 100%; border-bottom: 1px solid #333; }
        h1 { color: red; margin: 0; }
        
        /* ব্যানারের স্টাইল */
        .ad-slot { width: 100%; max-width: 500px; text-align: center; margin: 10px 0; min-height: 50px; background: #050505; }
        
        .v-card { width: 100%; max-width: 500px; margin-top: 10px; background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #333; position: relative; }
        video { width: 100%; display: block; }
        .title { padding: 15px; font-size: 18px; font-weight: bold; text-align: center; }

        /* Full Screen Ad Overlay */
        #ad-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: none; flex-direction: column;
        }
        #ad-frame { width: 100%; height: 88%; border: none; background: #fff; }
        
        #skip-bar {
            height: 12%; background: #111; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 20px; border-top: 1px solid #333;
        }
        .tmr-text { color: yellow; font-size: 15px; }
        .s-btn { 
            padding: 10px 20px; background: #333; color: #888; 
            border: none; border-radius: 5px; cursor: not-allowed; font-weight: bold;
        }
        .s-btn.active { background: #fff; color: #000; cursor: pointer; }
        
        .play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }
        .play-icon { width: 65px; height: 65px; background: red; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="ad-screen">
    <iframe id="ad-frame" src=""></iframe>
    <div id="skip-bar">
        <div id="tmr-txt" class="tmr-text">Wait 5s...</div>
        <button id="skp-btn" class="s-btn">Skip Ad</button>
    </div>
</div>

<div id="main-content">
    <header><h1>X-WORLD Live</h1></header>

    <div class="ad-slot" id="top-banner">
        </div>

    <div id="vBox">Loading...</div>

    <div class="ad-slot" id="bottom-banner">
        </div>
</div>

<script type="module">

</script>
</body>
</html>
